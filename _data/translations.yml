# English
en:
  site:
    title: "Guidecast"
    description: "Professional Tour Guiding with One App, No Megaphone Needed"
    og_description: "Real-time voice broadcasting, instant QR access, AI travel answers, and location tracking. Replace shared receivers with tourists' smartphones for a more hygienic and smarter tour."

  nav:
    home: "Home"
    features: "Features"
    pricing: "Pricing"
    faq: "FAQ"

  hero:
    headline: "Professional Tour Guiding <br/>with One App, No Megaphone Needed"
    subheadline: "Real-time voice broadcasting, instant QR access, AI travel answers, and location tracking. Replace shared receivers with tourists' smartphones for a more hygienic and smarter tour."
    info_box: "Only guides subscribe. Tourists always free, instant join via QR scan."
    cta_button: "Watch Demo (30s)"
    image_alt: "Guide showing QR code while tourists scan to join"

  pain_points:
    title: "Why Guided Tours Are Losing to Independent Travel"
    items:
      - icon: "📢"
        title: "Can't Use Megaphones, Can't Be Heard Without Them"
        description: "Groups of 10+ need megaphones for explanations, but noise regulations (Quiet Zones) are getting stricter."
      - icon: "🦠"
        title: "Shared Receivers Make Tourists Uncomfortable"
        description: "Earphones someone else wore, straps around someone else's neck. No matter how much you sanitize, hygiene-conscious tourists say 'I'd rather go alone.'"
      - icon: "🙋"
        title: "Repetitive Questions Exhaust Guides, Frustrate Tourists"
        description: "Where's the restroom? What time do we meet? What's that building? When 10 people ask at different times, you can't focus on your commentary."

  solution:
    title: "Guidecast App Solves Everything"
    features:
      - icon: "🎙️"
        title: "Real-time Voice Broadcasting"
        description: "WebRTC-based ultra-low-latency audio. Crystal clear delivery to 30 people without a megaphone. Background playback even with screen off."
      - icon: "⚡"
        title: "Instant Join via QR Scan"
        description: "Guide shows QR, tourists scan and connect instantly. No complex sign-up, done in 3 seconds."
      - icon: "🤖"
        title: "AI Answers Repetitive Questions"
        description: "\"Where's the restroom?\" \"What time do we meet?\" — AI answers instantly in-app based on info the guide pre-registers. Guide focuses only on commentary."
      - icon: "📍"
        title: "Real-time Location Tracking"
        description: "See guide and your location on the in-app map in real-time. No worry if you fall behind taking photos. Auto-deactivates when tour ends for privacy."

  app_vs_web:
    title: "What's Possible Because It's an App"
    badge: "✓ App"
    headers:
      item: "Feature"
      web: "Web-based Solution"
      guidecast: "Guidecast (App)"
    rows:
      - item: "Listen with Screen Off"
        web: "❌ Cuts off when screen turns off"
        guidecast: "✅ Background playback supported"
      - item: "Battery Efficiency"
        web: "⚠️ Browser always running"
        guidecast: "✅ Battery saver mode"
      - item: "Location Tracking"
        web: "⚠️ Limited"
