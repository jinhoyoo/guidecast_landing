# 中文（简体）(Simplified Chinese)
zh-CN:
  site:
    title: "Guidecast"
    description: "无需扩音器，一个App搞定专业导览讲解"
    og_description: "实时语音直播、扫码即时接入、行程笔记同步共享。告别公共接收器，用游客自己的手机，打造更卫生、更清晰的导览体验。"

  nav:
    why_now: "导游的现实"
    features: "这样解决"
    pricing: "价格方案"
    faq: "常见问题"
    header_cta: "填写预约问卷"

  hero:
    launch_badge: "即将上线 · 参与预约问卷赠送免费额度"
    headline: "无需扩音器，一个App即可搞定\n专业导览讲解"
    subheadline: "实时语音直播 · 扫码即时接入 · 行程笔记同步共享。\n告别公共接收器，用游客自己的手机，打造更卫生、更清晰的导览体验。"
    info_box: "游客始终免费，扫码3秒即可加入。导游只需按场次付费，按需使用。"
    cta_primary: "填写预约问卷，领取免费额度"
    cta_secondary: "观看演示视频（30秒）"
    image_alt: "导游出示二维码，游客扫码加入的场景"

  why_now:
    eyebrow: "导游的现实困境"
    title: "跟团导览为何败给自由行——三大原因"
    items:
      - icon: "📢"
        title: "扩音器不能用，不用又听不见"
        description: "10人以上的团队没有扩音器根本讲不清楚，而噪音管制（安静区）却越来越严格。"
      - icon: "🦠"
        title: "公共接收器，游客用着不放心"
        description: "别人戴过的耳机、挂过的挂绳，无论怎么消毒，对卫生敏感的游客还是会想：“不如自己逛。”"
      - icon: "🙋"
        title: "发了资料，游客也很难跟上"
        description: "导游就算提前准备好讲解资料，只要游客错过或看向别处就白费了。无法让所有人看到同一屏幕，导览质量自然大打折扣。"

  features:
    eyebrow: "这样解决"
    title: "Guidecast 帮你全部解决"
    items:
      - icon: "🎙️"
        title: "实时语音直播"
        description: "基于WebRTC的超低延迟（P95低于0.5秒）。即使面对30人，无需扩音器也能清晰传达，锁屏也可后台播放。"
      - icon: "⚡"
        title: "扫码即时加入"
        description: "导游出示二维码，游客扫码即可直接接入，无需繁琐注册，3秒完成。采用BYOD模式，游客只需用自己的耳机和手机，卫生问题一扫而空。"
      - icon: "📑"
        title: "行程笔记同步共享"
        description: "导游翻页时，所有参与者的屏幕会在1秒内同步显示同一页面。即使有人前后翻看，只要导游切换页面就会立即跟上。"
    aside:
      icon: "📱"
      text: "安装App不是门槛，而是稳定导览品质的必要条件。安装包不到50MB，导游会在导览开始前自然引导游客完成安装。"

  pricing:
    eyebrow: "价格方案"
    title: "价格——无需订阅，按场次付费"
    billing_aside:
      icon: "💰"
      text: "计费单位：场次（Session）——1场次最长8小时，直播结束即刻停止计费。仅在需要时通过App内购（IAP）购买，无需签约，没有月度订阅。"
    launch_note:
      icon: "🚀"
      text: "目前尚未正式上线。以下为预计上线价格，现在填写预约问卷，即可在正式上线时第一时间获得免费场次额度。"
    plans:
      session_s:
        name: "场次 S（约5人）"
        price: "$9.99"
        use_case: "个人导游 / 小型团队"
        features:
          - "实时语音 + 扫码接入 + 资料共享"
        button: "填写预约问卷"
      session_m:
        badge: "热门"
        name: "场次 M（约15人）"
        price: "$19.99"
        use_case: "普通团队导览"
        features:
          - "包含场次 S 全部功能 + 大规模稳定运行"
        button: "填写预约问卷"
      session_l:
        name: "场次 L（约30人）"
        price: "$29.99"
        use_case: "大型团队导览"
        features:
          - "包含场次 M 全部功能 + 专业导游主力之选"
        button: "填写预约问卷"
    notes:
      - icon: "🎁"
        title: "首次场次免费额度"
        description: "赠送最多支持30人（场次L）的免费场次1次，顺利完成后再额外赠送1次。"
      - icon: "📦"
        title: "额度套餐包"
        description: "打包预购场次可享折扣（例如：10场次套餐享15%折扣）。"
      - icon: "⚖️"
        title: "对比硬件成本"
        description: "购买一套无线接收器（10人用）需花费$1,000~1,500。而Guidecast即使是30人的导览，一次场次L仅需$29.99即可搞定。"
    small_print: "游客始终免费，仅导游需要付费。"

  cta:
