    title: "Guidecast"
    description: "메가폰 없이, 앱 하나로 완성하는 프로 투어 가이드"
    og_description: "실시간 음성 방송, QR 즉시 접속, AI 여행 답변, 위치 확인까지. 공용 리시버 대신 관광객의 스마트폰으로, 더 위생적이고 더 스마트한 투어."

  nav:
    home: "홈"
    features: "기능"
    pricing: "요금제"
    faq: "FAQ"

  hero:
    headline: "메가폰 없이, <br/>앱 하나로 완성하는 프로 투어 가이드"
    subheadline: "실시간 음성 방송, QR 즉시 접속, AI 여행 답변, 위치 확인까지. 공용 리시버 대신 관광객의 스마트폰으로, 더 위생적이고 더 스마트한 투어."
    info_box: "가이드만 구독. 관광객은 항상 무료, QR 스캔으로 바로 참여."
    cta_button: "데모 영상 보기 (30초)"
    image_alt: "가이드가 QR코드를 보여주고 관광객이 스캔하는 장면"

  pain_points:
    title: "가이드 투어가 개인 관광에 밀리는 이유"
    items:
      - icon: "📢"
        title: "메가폰은 못 쓰고, 안 쓰면 안 들린다"
        description: "10명 이상 단체 투어는 메가폰 없이 설명이 불가능한데, 소음 규제(Quiet Zone)는 점점 강해지고 있습니다."
      - icon: "🦠"
        title: "공용 리시버, 관광객은 찝찝하다"
        description: "남이 귀에 꽂았던 이어폰, 목에 걸었던 끈. 아무리 소독해도 위생에 민감한 관광객은 '차라리 혼자 다니겠다'고 합니다."
      - icon: "🙋"
        title: "반복 질문에 가이드는 지치고, 관광객은 불편하다"
        description: "화장실 어디예요? 집합 시간이요? 저 건물 뭔가요? 10명이 각자 다른 타이밍에 물어보면 해설에 집중할 수 없습니다."

  solution:
    title: "Guidecast 앱 하나면 전부 해결됩니다"
    features:
      - icon: "🎙️"
        title: "실시간 음성 방송"
        description: "WebRTC 기반 초저지연 오디오. 30명에게도 메가폰 없이 선명하게 전달. 화면 꺼도 백그라운드 재생으로 끊김 없음."
      - icon: "⚡"
        title: "QR 스캔으로 즉시 참여"
        description: "가이드가 QR 보여주면 관광객이 스캔해 바로 접속. 복잡한 회원가입 없이 3초 완료."
      - icon: "🤖"
        title: "AI가 반복 질문 대신 답변"
        description: "\"화장실 어디예요?\" \"집합 시간이요?\" — 가이드가 사전 등록한 정보 기반으로 AI가 앱 내에서 즉시 답변. 가이드는 해설에만 집중."
      - icon: "📍"
        title: "실시간 위치 확인"
        description: "앱 내 지도에서 가이드와 내 위치를 실시간으로 확인. 사진 찍다가 일행을 놓쳐도 안심. 투어 종료 시 자동 비활성화로 프라이버시 보호."

  app_vs_web:
    title: "앱이기 때문에 가능한 것들"
    badge: "✓ 앱"
    headers:
      item: "항목"
      web: "웹 기반 솔루션"
      guidecast: "Guidecast (앱)"
    rows:
