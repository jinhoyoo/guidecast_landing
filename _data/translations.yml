  faq:
    title: "자주 묻는 질문"
    items:
      - question: "관광객도 비용을 내나요?"
        answer: "아니요. 관광객은 항상 무료입니다. 가이드의 안내에 따라 앱을 설치하고 QR을 스캔하면 바로 참여할 수 있습니다. 결제와 구독은 가이드만 해당됩니다."
      - question: "앱을 꼭 설치해야 하나요?"
        answer: "네, Guidecast는 앱 기반 서비스입니다. 앱이기 때문에 화면을 꺼도 끊김 없는 백그라운드 재생, 배터리 절약, 실시간 위치 확인이 가능합니다. 앱 용량은 50MB 이하로 가볍고, 가이드의 안내로 투어 시작 전 자연스럽게 설치할 수 있습니다."
      - question: "메가폰 없이 정말 30명에게 전달이 되나요?"
        answer: "네. WebRTC 기반 초저지연 기술로 P95 지연 0.5초 미만의 선명한 오디오를 전달합니다. 관광객은 본인 이어폰으로 듣기 때문에 주변 소음과 관계없이 깨끗하게 들을 수 있습니다."
      - question: "AI는 어떤 질문에 답할 수 있나요?"
        answer: "가이드가 사전 등록한 정보(투어 장소, 시간, 시설 위치, 주의사항 등) 기반으로 답변합니다. 등록되지 않은 질문에는 \"가이드에게 직접 문의해주세요\"라고 안내하여 잘못된 정보를 제공하지 않습니다."
      - question: "인터넷이 불안정한 곳에서도 괜찮은가요?"
        answer: "4G/5G 모바일 데이터만으로 충분히 작동하며, 네트워크가 불안정할 때는 로컬 버퍼링과 자동 재접속으로 끊김을 최소화합니다. 데이터 사용량은 1시간 기준 약 50~100MB 수준입니다."
      - question: "무료 체험 후 자동 결제되나요?"
        answer: "아니요, 자동 결제되지 않습니다. 14일 무료 체험 후 원하실 때 유료 구독을 선택하시면 됩니다."
      - question: "위치 추적이 프라이버시에 문제되지 않나요?"
        answer: "위치 공유는 투어 세션 중에만 활성화되고, 종료 즉시 자동으로 비활성화됩니다. 관광객은 원하면 언제든 위치 공유를 끌 수 있는 옵트아웃 옵션이 있습니다."

