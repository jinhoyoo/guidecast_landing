      - question: "不用擴音器真的能傳達給30人嗎？"
        answer: "是的。使用基於WebRTC的超低延遲技術，以P95延遲低於0.5秒傳達清晰音訊。遊客用自己的耳機聆聽，因此不受周圍噪音影響。"
      - question: "AI能回答什麼問題？"
        answer: "根據導遊預先登錄的資訊（導覽地點、時間、設施位置、注意事項等）回答。對於未登錄的問題，會引導「請直接詢問導遊」，不會提供錯誤資訊。"
      - question: "網路不穩定的地方也能用嗎？"
        answer: "4G/5G行動數據就足以運作，網路不穩定時透過本地緩衝和自動重連將中斷降到最低。每小時數據使用量約50~100MB。"
      - question: "免費試用後會自動扣款嗎？"
        answer: "不會自動扣款。14天免費試用結束後，您可以在準備好時選擇付費訂閱。"
      - question: "位置追蹤會有隱私問題嗎？"
        answer: "位置分享僅在導覽場次期間啟用，結束後立即自動關閉。遊客隨時可以選擇關閉位置分享。"

