      icon: "🚀"
      text: "Todavía no está disponible el lanzamiento oficial. Los precios que ves abajo son los previstos para el lanzamiento, y si te unes ahora a la encuesta anticipada, serás de los primeros en recibir créditos de sesión gratis cuando lancemos."
    plans:
      session_s:
        name: "Sesión S (~5 personas)"
        price: "$9.99"
        use_case: "Guía individual / tours pequeños"
        features:
          - "Voz en tiempo real + QR + material compartido"
        button: "Unirme a la lista de espera"
      session_m:
        badge: "Popular"
        name: "Sesión M (~15 personas)"
        price: "$19.99"
        use_case: "Tours grupales estándar"
        features:
          - "Todo lo de Sesión S + operación estable para grupos grandes"
        button: "Unirme a la lista de espera"
      session_l:
        name: "Sesión L (~30 personas)"
        price: "$29.99"
        use_case: "Tours grupales de gran tamaño"
        features:
          - "Todo lo de Sesión M + pensada para guías profesionales de alto volumen"
        button: "Unirme a la lista de espera"
    notes:
      - icon: "🎁"
        title: "Crédito gratis para tu primera sesión"
        description: "Incluye 1 sesión gratis para hasta 30 personas (Sesión L). Si la completas con éxito, recibes 1 sesión adicional."
      - icon: "📦"
        title: "Paquetes de créditos"
        description: "Compra sesiones por adelantado en paquetes y obtén descuentos (por ejemplo, 15% de descuento en el paquete de 10 sesiones)."
      - icon: "⚖️"
        title: "Frente al hardware tradicional"
        description: "Un set de receptores inalámbricos (10 personas) cuesta entre $1,000 y $1,500. Con Guidecast, un tour de 30 personas se resuelve con una sola Sesión L de $29.99."
    small_print: "Los turistas siempre participan gratis. Solo el guía realiza el pago."

