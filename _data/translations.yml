  faq:
    title: "常见问题"
    items:
      - question: "现在可以立即使用吗？"
        answer: "目前尚未正式上线。填写预约问卷后，我们会第一时间通知您上线信息，并送上免费场次额度。"
      - question: "游客也需要付费吗？"
        answer: "不需要，游客始终免费，扫码即可直接加入。"
      - question: "不用扩音器也能传达给30人吗？"
        answer: "可以。基于WebRTC的超低延迟（P95低于0.5秒），声音会清晰地传送到每个人自己的耳机中。"
      - question: "一定要安装App吗？"
        answer: "是的。为了实现后台播放、省电以及行程笔记同步接收，该服务基于App运行，安装包大小不到50MB。"
      - question: "网络不稳定也没关系吗？"
        answer: "4G/5G网络即可满足需求，本地缓冲和自动重连机制可将卡顿降到最低。"
      - question: "导览资料（行程笔记）是如何共享的？"
        answer: "导游翻页后，所有参与者的屏幕会在1秒内同步显示。"

