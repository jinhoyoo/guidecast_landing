# English
en:
  site:
    title: "Guidecast"
    description: "Professional tour guiding, no megaphone required — just one app."
    og_description: "Live audio broadcasting, instant QR access, synced travel notes. Tours delivered through tourists' own smartphones instead of shared receivers — cleaner and clearer."

  nav:
    why_now: "Reality for Guides"
    features: "Here's the Fix"
    pricing: "Pricing"
    faq: "FAQ"
    header_cta: "Join the Waitlist"

  hero:
    launch_badge: "Launching Soon · Get Credits for Joining the Waitlist"
    headline: "Professional Tour Guiding,\nNo Megaphone Required"
    subheadline: "Live audio broadcasting · Instant QR access · Synced travel notes.\nTours delivered through tourists' own smartphones instead of shared receivers — cleaner and clearer."
    info_box: "Always free for tourists. Join in 3 seconds with a QR scan. Guides pay only per session, only when they need it."
    cta_primary: "Join the Waitlist for Free Credits"
    cta_secondary: "Watch the Demo (30s)"
    image_alt: "A guide holding up a QR code as a tourist scans it"

  why_now:
    eyebrow: "The Reality for Guides"
    title: "3 Reasons Guided Tours Are Losing to Solo Travel"
    items:
      - icon: "📢"
        title: "Megaphones Are Banned — But Without One, No One Can Hear You"
        description: "Groups of 10 or more are nearly impossible to guide without amplification, and Quiet Zone noise restrictions keep getting stricter."
      - icon: "🦠"
        title: "Shared Receivers Make Tourists Uneasy"
        description: "Earbuds worn by strangers, straps hung around other people's necks — no matter how much you sanitize them, hygiene-conscious tourists say, \"I'd rather just go it alone.\""
      - icon: "🙋"
        title: "Handouts Don't Keep Everyone on the Same Page"
        description: "Even when a guide prepares materials in advance, it's useless if participants miss a page or look away. When everyone isn't seeing the same screen, tour quality drops."

  features:
    eyebrow: "Here's the Fix"
    title: "Guidecast Solves It"
    items:
      - icon: "🎙️"
        title: "Live Audio Broadcasting"
        description: "WebRTC-powered, ultra-low latency (under 0.5s at P95). Crystal-clear audio for up to 30 people with no megaphone — keeps playing in the background even with the screen off."
      - icon: "⚡"
        title: "Instant Access with a QR Scan"
        description: "The guide shows a QR code, tourists scan it, and they're in — no account sign-up, done in 3 seconds. It's BYOD: just your own earbuds and smartphone, so hygiene is never a concern."
      - icon: "📑"
        title: "Synced Travel Notes"
        description: "When the guide flips to a new page, it appears on every participant's screen within a second. Scroll away if you like — the moment the guide moves on, you snap right back in sync."
    aside:
      icon: "📱"
      text: "Installing the app isn't a barrier — it's what makes reliable tour quality possible. At under 50MB, it installs effortlessly before the tour with a quick nudge from the guide."

  pricing:
    eyebrow: "Pricing"
    title: "Pricing — Pay Per Session, No Subscription"
    billing_aside:
      icon: "💰"
      text: "Billing unit: Session — 1 session covers up to 8 hours and ends the moment you stop broadcasting. Purchased in-app (IAP) only when you need it, so there's no contract and no monthly subscription."
    launch_note:
      icon: "🚀"
      text: "We haven't officially launched yet. The prices below are our planned launch pricing — join the waitlist now and be first in line for free session credits at launch."
    plans:
      session_s:
        name: "Session S (up to 5 people)"
        price: "$9.99"
        use_case: "Independent guides / small tours"
        features:
          - "Live audio + QR access + note sharing"
        button: "Join the Waitlist"
      session_m:
        badge: "Popular"
        name: "Session M (up to 15 people)"
        price: "$19.99"
        use_case: "Standard group tours"
        features:
          - "Everything in Session S, plus stable performance for larger groups"
        button: "Join the Waitlist"
      session_l:
        name: "Session L (up to 30 people)"
        price: "$29.99"
        use_case: "Large group tours"
        features:
          - "Everything in Session M, built for full-time professional guides"
        button: "Join the Waitlist"
    notes:
      - icon: "🎁"
        title: "Free First-Session Credit"
        description: "Get one free session at Session L scale (up to 30 people). Complete it successfully and we'll give you a second one."
      - icon: "📦"
        title: "Credit Packs"
        description: "Pre-purchase sessions in bulk for a discount (e.g., 15% off a 10-session pack)."
      - icon: "⚖️"
        title: "Compared to Hardware"
        description: "A wireless receiver set for 10 people runs $1,000–1,500. With Guidecast, a 30-person tour costs just $29.99 for one Session L."
    small_print: "Tourists always join for free. Only guides pay."

  cta:
    title: "Be the First to Experience the Full Launch"
    subtitle: "Join the waitlist and be first in line for free session credits at launch."
    button: "Join the Waitlist"
    links:
      faq: "View FAQ"

  faq:
    title: "Frequently Asked Questions"
    items:
      - question: "Can I use it right now?"
        answer: "We haven't officially launched yet. Join the waitlist and you'll be the first to hear about launch news and free session credits."
      - question: "Do tourists have to pay?"
        answer: "No, it's always free. They join instantly with a QR scan."
      - question: "Can it reach 30 people without a megaphone?"
        answer: "Yes. With WebRTC's ultra-low latency (under 0.5s at P95), audio comes through clearly right in each person's own earbuds."
      - question: "Do I have to install the app?"
        answer: "Yes. The app enables background playback, battery efficiency, and synced travel notes — and it's under 50MB."
      - question: "What if the internet connection is unstable?"
        answer: "4G/5G is plenty. Local buffering and automatic reconnection keep interruptions to a minimum."
      - question: "How are tour materials (travel notes) shared?"
        answer: "The moment the guide flips a page, it appears on every participant's screen within a second."

  footer:
    brand: "Guidecast"
    instagram_label: "Instagram: @guidecast.official"
    website_label: "Website: guidecast.com"
    cookie_settings: "Cookie Settings"
    copyright: "2026 Guidecast. All rights reserved."

  cookie_consent:
    message: "This website uses cookies to improve our service. Analytics cookies (Google Analytics) are only used with your consent, and you can change your settings at any time."
    accept: "Accept Analytics"
    reject: "Necessary Only"

  form:
    title: "Early Bird Application"
    subtitle: "Leave your contact and feedback to receive <strong>3 free Session M credits</strong> after launch!"
    name_label: "Name *"
    name_placeholder: "John Doe"
    email_label: "Email *"
    email_placeholder: "example@email.com"
    phone_label: "Phone Number"
    phone_placeholder: "234-567-8900"
    country_code_label: "Country Code"
    company_label: "Organization (Optional)"
    company_placeholder: "Independent guide / Travel agency name, etc."
    feedback_label: "Feedback & Expectations *"
    feedback_placeholder: "Feel free to share what you expect from Guidecast or features you need."
    privacy_label: "I agree to the collection and use of personal information."
    submit_button: "Get 3 Free Session M Credits"
    submitting: "Submitting..."
    success_title: "Application Complete!"
    success_message: "Thank you for your valuable feedback.<br>We'll send you <strong>3 free Session M credits</strong> via email after launch."
    success_button: "OK"
    q1_label: "How do you currently conduct your tours?"
    q1_option1: "Using dedicated equipment (audio guide, etc.)"
    q1_option2: "Using only my voice"
    q1_option3: "Using other apps/tools"
    q1_option4: "Haven't started yet, but preparing"
    q2_label: "If Guidecast app allows you to run tours without equipment, how do you feel about a per-session fee of $9.99 ~ $29.99?"
    q2_option1: "I'm willing to pay that amount"
    q2_option2: "I could consider it depending on the situation"
    q2_option3: "I probably won't use it if it's paid"

# Español (Spanish)
es:
  site:
    title: "Guidecast"
    description: "Guía de tours profesional desde una sola app, sin megáfono"
    og_description: "Transmisión de voz en tiempo real, acceso instantáneo por QR y notas de viaje compartidas al mismo tiempo. En lugar de receptores compartidos, cada turista usa su propio smartphone: un tour más higiénico y más claro."

  nav:
    why_now: "La realidad del guía"
    features: "Así lo resolvemos"
    pricing: "Precios"
    faq: "Preguntas frecuentes"
    header_cta: "Unirme a la lista de espera"

  hero:
    launch_badge: "Próximo lanzamiento · Créditos por unirte a la encuesta anticipada"
    headline: "Guía de tours profesional desde una sola app,\nsin megáfono"
    subheadline: "Transmisión de voz en tiempo real · Acceso instantáneo por QR · Notas de viaje compartidas al instante.\nCada turista usa su propio smartphone en vez de un receptor compartido: un tour más higiénico y más claro."
    info_box: "Los turistas participan siempre gratis. Se unen en 3 segundos escaneando un QR. Los guías pagan solo por sesión, cuando lo necesitan."
    cta_primary: "Unirme y recibir créditos"
    cta_secondary: "Ver demo (30 seg)"
    image_alt: "Un guía muestra un código QR mientras un turista lo escanea"

  why_now:
    eyebrow: "La realidad del guía"
    title: "3 razones por las que los tours guiados pierden frente al turismo individual"
    items:
      - icon: "📢"
        title: "El megáfono ya no se puede usar, pero sin él no te escuchan"
        description: "Con grupos de más de 10 personas es imposible explicar sin megáfono, y las zonas de silencio (Quiet Zones) son cada vez más estrictas."
      - icon: "🦠"
        title: "Los receptores compartidos incomodan a los turistas"
        description: "Auriculares que otros ya se pusieron, correas que otros ya llevaron al cuello. Por más que se desinfecten, los turistas más exigentes con la higiene prefieren \"recorrer todo por su cuenta\"."
      - icon: "🙋"
        title: "Aunque repartas material, es difícil que todos sigan el ritmo"
        description: "De nada sirve preparar material si los participantes lo pierden de vista o miran hacia otro lado. Cuando no todos ven la misma pantalla, la calidad del tour se resiente."

  features:
    eyebrow: "Así lo resolvemos"
    title: "Guidecast lo resuelve por ti"
    items:
      - icon: "🎙️"
        title: "Transmisión de voz en tiempo real"
        description: "Latencia ultrabaja basada en WebRTC (P95 menor a 0.5 segundos). Llega con claridad a 30 personas sin megáfono, y sigue reproduciéndose en segundo plano con la pantalla apagada."
      - icon: "⚡"
        title: "Participación instantánea por QR"
        description: "El guía muestra el QR, el turista lo escanea y entra al instante. Sin registros complicados, en solo 3 segundos. Al ser BYOD (cada quien con sus propios auriculares y smartphone), tampoco hay que preocuparse por la higiene."
      - icon: "📑"
        title: "Notas de viaje compartidas al instante"
        description: "Cuando el guía avanza el material, la misma página aparece en la pantalla de todos los participantes en menos de 1 segundo. Si adelantas o retrocedes, todos siguen al guía de inmediato."
    aside:
      icon: "📱"
      text: "Instalar la app no es una barrera, sino un requisito indispensable para garantizar la calidad del tour. Ocupa menos de 50 MB y se instala de forma natural antes del tour, guiado por el propio guía."

  pricing:
    eyebrow: "Precios"
    title: "Precios: por sesión, sin suscripciones"
    billing_aside:
      icon: "💰"
      text: "Unidad de cobro: sesión (Session) — 1 sesión = hasta 8 horas. Termina de inmediato al finalizar la transmisión. Se compra dentro de la app (IAP) solo cuando la necesitas, sin contratos ni suscripciones mensuales."
