# 한국어
ko:
  site:
    title: "Guidecast"
    description: "메가폰 없이, 앱 하나로 완성하는 프로 투어 가이드"
    og_description: "실시간 음성 방송, QR 즉시 접속, 여행노트 동시 공유. 공용 리시버 대신 관광객의 스마트폰으로, 더 위생적이고 더 선명한 투어."

  nav:
    why_now: "가이드의 현실"
    features: "이렇게 해결하세요"
    pricing: "요금제"
    faq: "FAQ"
    header_cta: "사전 설문 남기기"

  hero:
    launch_badge: "출시 예정 · 사전 설문 참여 시 크레딧 증정"
    headline: "메가폰 없이, 앱 하나로 완성하는\n프로 투어 가이드"
    subheadline: "실시간 음성 방송 · QR 즉시 접속 · 여행노트 동시 공유.\n공용 리시버 대신 관광객의 스마트폰으로, 더 위생적이고 더 선명한 투어."
    info_box: "관광객은 항상 무료. QR 스캔으로 3초 만에 참여. 가이드는 필요할 때만 세션 단위로 결제합니다."
    cta_primary: "사전 설문 남기고 크레딧 받기"
    cta_secondary: "데모 영상 보기 (30초)"
    image_alt: "가이드가 QR코드를 보여주고 관광객이 스캔하는 장면"

  why_now:
    eyebrow: "가이드의 현실"
    title: "가이드 투어가 개인 관광에 밀리는 이유 — 3가지"
    items:
      - icon: "📢"
        title: "메가폰은 못 쓰고, 안 쓰면 안 들려요"
        description: "10명 이상 단체는 메가폰 없이 설명이 불가능한데, 소음 규제(Quiet Zone)는 점점 강해집니다."
      - icon: "🦠"
        title: "공용 리시버, 관광객은 찝찝해요"
        description: "남이 귀에 꽂았던 이어폰, 목에 걸었던 끈. 아무리 소독해도 위생에 민감한 관광객은 \"차라리 혼자 다니겠다\"고 합니다."
      - icon: "🙋"
        title: "자료를 나눠줘도 따라가기 힘들어요"
        description: "가이드가 안내 자료를 미리 준비해도 참여자가 놓치거나 딴 데를 보면 소용이 없습니다. 모두가 같은 화면을 보지 못하면 투어 퀄리티가 떨어집니다."

  features:
    eyebrow: "이렇게 해결하세요"
    title: "가이드캐스트로 해결됩니다"
    items:
      - icon: "🎙️"
        title: "실시간 음성 방송"
        description: "WebRTC 기반 초저지연(P95 0.5초 미만). 30명에게도 메가폰 없이 선명하게, 화면을 꺼도 백그라운드 재생."
      - icon: "⚡"
        title: "QR 스캔 즉시 참여"
        description: "가이드가 QR을 보여주면 관광객이 스캔해 바로 접속. 복잡한 회원가입 없이 3초 완료. 본인 이어폰·스마트폰만 있으면 되는 BYOD 방식이라 위생 걱정도 없습니다."
      - icon: "📑"
        title: "여행노트 동시 공유"
        description: "가이드가 자료를 넘기면 모든 참여자 화면에 같은 페이지가 1초 내에 동시에 표시. 앞뒤로 넘겨봐도 가이드가 이동하면 바로 따라갑니다."
    aside:
      icon: "📱"
      text: "앱 설치는 장벽이 아니라 안정적인 투어 품질을 위한 필수 조건입니다. 용량 50MB 이하, 가이드 안내로 투어 전 자연스럽게 설치됩니다."

  pricing:
    eyebrow: "요금제"
    title: "요금 — 구독 없이 세션 단위로"
    billing_aside:
      icon: "💰"
      text: "과금 단위: 세션(Session) — 1 세션 = 최대 8시간. 방송 종료 시 즉시 종료. 필요할 때만 앱 내에서 구매(IAP)하므로 약정·월 구독이 없습니다."
    launch_note:
      icon: "🚀"
      text: "아직 정식 출시 전입니다. 아래 요금은 출시 예정 가격이며, 지금 사전 설문에 참여하시면 출시 시 무료 세션 크레딧을 가장 먼저 드립니다."
    plans:
      session_s:
        name: "세션 S (~5명)"
        price: "$9.99"
        use_case: "개인 가이드 / 소규모 투어"
        features:
          - "실시간 음성 + QR + 자료 공유"
        button: "사전 설문 남기기"
      session_m:
        badge: "인기"
        name: "세션 M (~15명)"
        price: "$19.99"
        use_case: "일반 단체 투어"
        features:
          - "세션 S 전체 + 대규모 안정 운영"
        button: "사전 설문 남기기"
      session_l:
        name: "세션 L (~30명)"
        price: "$29.99"
        use_case: "대규모 단체 투어"
        features:
          - "세션 M 전체 + 주력 전문 가이드용"
        button: "사전 설문 남기기"
    notes:
      - icon: "🎁"
        title: "첫 세션 무료 크레딧"
        description: "최대 30명 규모(세션 L) 무료 세션 1회 제공. 잘 마치면 1회 추가."
      - icon: "📦"
        title: "크레딧 팩"
        description: "세션을 묶음으로 선구매 시 할인(예: 10세션 팩 15% 할인)."
      - icon: "⚖️"
        title: "하드웨어 대비"
        description: "무선 리시버 세트(10인) 구매 시 $1,000~1,500. Guidecast는 30명 투어도 세션 L 1회 $29.99로 해결."
    small_print: "관광객은 항상 무료입니다. 결제는 가이드만 해당됩니다."

  cta:
    title: "정식 출시를 가장 먼저 만나보세요"
    subtitle: "사전 설문에 참여하시면 출시 시 무료 세션 크레딧을 가장 먼저 드립니다."
    button: "사전 설문 남기기"
    links:
      faq: "FAQ 보기"

  faq:
    title: "자주 묻는 질문"
    items:
      - question: "지금 바로 사용할 수 있나요?"
        answer: "아직 정식 출시 전입니다. 사전 설문에 참여해주시면 출시 소식과 무료 세션 크레딧을 가장 먼저 안내해드립니다."
      - question: "관광객도 비용을 내나요?"
        answer: "아니요, 항상 무료입니다. QR 스캔으로 바로 참여합니다."
      - question: "메가폰 없이 30명에게 전달되나요?"
        answer: "네. WebRTC 초저지연(P95 0.5초 미만)으로 본인 이어폰에 선명하게 전달됩니다."
      - question: "앱을 꼭 설치해야 하나요?"
        answer: "네. 백그라운드 재생·배터리 절약·여행노트 동시 수신을 위한 앱 기반 서비스이며, 용량은 50MB 이하입니다."
      - question: "인터넷이 불안정해도 괜찮나요?"
        answer: "4G/5G로 충분하며, 로컬 버퍼링·자동 재접속으로 끊김을 최소화합니다."
      - question: "투어 자료(여행노트)는 어떻게 공유되나요?"
        answer: "가이드가 넘기면 모든 참여자 화면에 1초 내로 동시에 표시됩니다."

  footer:
    brand: "Guidecast"
    instagram_label: "인스타그램: @guidecast.official"
    website_label: "웹사이트: guidecast.com"
    cookie_settings: "쿠키 설정"
    copyright: "2026 Guidecast. All rights reserved."

  cookie_consent:
    message: "이 웹사이트는 서비스 개선을 위해 쿠키를 사용합니다. 분석 쿠키(Google Analytics)는 동의하신 경우에만 사용되며, 언제든지 설정을 변경할 수 있습니다."
    accept: "분석 허용"
    reject: "필수만 허용"

  form:
    title: "얼리버드 신청"
    subtitle: "연락처와 의견을 남겨주시면 출시 후 <strong>세션 M 3회 무료 크레딧</strong>을 드립니다!"
    name_label: "이름 *"
    name_placeholder: "홍길동"
    email_label: "이메일 *"
    email_placeholder: "example@email.com"
    phone_label: "전화번호"
    phone_placeholder: "010-1234-5678"
    country_code_label: "국가 코드"
    company_label: "소속 (선택)"
    company_placeholder: "개인 가이드 / 여행사명 등"
    feedback_label: "의견 및 기대사항 *"
    feedback_placeholder: "Guidecast에 기대하는 점이나 필요한 기능을 자유롭게 작성해주세요."
    privacy_label: "개인정보 수집 및 이용에 동의합니다."
    submit_button: "세션 M 3회 무료 받기"
    submitting: "전송 중..."
    success_title: "신청이 완료되었습니다!"
    success_message: "소중한 의견 감사합니다.<br>출시 후 이메일로 <strong>세션 M 3회 무료 크레딧</strong>을 보내드리겠습니다."
    success_button: "확인"
    q1_label: "현재 투어 운영 방식"
    q1_option1: "전용 장비 사용 (오디오 가이드 등)"
    q1_option2: "내 목소리만 사용"
    q1_option3: "다른 앱/도구 사용"
