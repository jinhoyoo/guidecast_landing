        description: "Blättert der Guide weiter, erscheint dieselbe Seite in unter 1 Sekunde auf allen Bildschirmen der Teilnehmer. Auch beim Vor- und Zurückblättern springt jeder sofort mit, sobald der Guide weitergeht."
