        guidecast: "✅ 앱 내 AI FAQ 즉시 응답"
      - item: "연결 안정성"
        web: "⚠️ 탭 전환 시 끊김"
        guidecast: "✅ 자동 재접속 + 로컬 버퍼링"
    note: "앱 설치는 장벽이 아니라, <strong>안정적인 투어 품질을 위한 필수 조건</strong>입니다. 가이드의 안내로 자연스럽게 설치하고, 용량은 50MB 이하로 가볍습니다."

  testimonials:
    title: "이미 전환한 가이드들의 이야기"
    items:
