# Site settings
title: Guidecast
description: 스마트폰으로 완성하는 프로 투어 가이드
baseurl: "" # 아래 도메인에 연결되기 때문에, 필요 없음 
url: "https://www.guidecast.co"

# Build settings
markdown: kramdown
permalink: pretty

# Plugins (GitHub Pages 지원)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - CLAUDE.md
  - CLAUDE.md.backup
  - CLAUDE_new.md
  - README.md

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "ko"
    values:
      lang: "ko"
  - scope:
      path: "en"
    values:
      lang: "en"
  - scope:
      path: "es"
    values:
      lang: "es"
  - scope:
      path: "zh-TW"
    values:
      lang: "zh-TW"
  - scope:
      path: "zh-CN"
    values:
      lang: "zh-CN"
  - scope:
      path: "ja"
    values:
      lang: "ja"
  - scope:
      path: "de"
    values:
      lang: "de"
  - scope:
      path: "it"
    values:
      lang: "it"

# SEO
twitter:
  username: guidecast
  card: summary_large_image

social:
  name: Guidecast
  links:
    - https://twitter.com/guidecast

# OpenGraph & Social Media
logo: /assets/images/og-image.jpg
image: /assets/images/og-image.jpg

# Analytics — gtag.js는 쿠키 동의 후 assets/js/cookie-consent.js가 동적으로 로드합니다 (Consent Mode v2)
google_analytics_id: "G-1V3SEJL0Q4"

# Google Apps Script URL for form submissions
google_script_url: "https://script.google.com/macros/s/AKfycbxuJhf-lOy4q7HYJb4o2ucuma9iULo3sCPIFuNdkcZ2PjBfXA8fmb0GyjfFLJOfMw030Q/exec"
