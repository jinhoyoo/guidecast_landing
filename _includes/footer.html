{% assign t = site.data.translations[page.lang].footer %}

<footer class="footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-brand">
        <h3>{{ t.brand }}</h3>
      </div>
      <ul class="footer-links">
        <li>
          <a href="https://instagram.com/guidecast.official" target="_blank" rel="noopener noreferrer">
            {{ t.instagram_label }}
          </a>
        </li>
        <li>
          <a href="https://guidecast.com" target="_blank" rel="noopener noreferrer">
            {{ t.website_label }}
          </a>
        </li>
      </ul>
    </div>
    <div class="footer-bottom">
      <p>&copy; {{ t.copyright }}</p>
      <div class="footer-legal-links">
        <button type="button" onclick="reopenCookieConsent()">{{ t.cookie_settings }}</button>
      </div>
      <div class="footer-social">
        <a href="https://www.facebook.com/profile.php?id=61585677064925"
           target="_blank" rel="noopener noreferrer"
           class="footer-social-link" aria-label="Facebook">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
               viewBox="0 0 24 24" fill="currentColor">
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
          </svg>
        </a>
        <a href="https://instagram.com/guidecast.official"
           target="_blank" rel="noopener noreferrer"
           class="footer-social-link" aria-label="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
               viewBox="0 0 24 24" fill="currentColor">
