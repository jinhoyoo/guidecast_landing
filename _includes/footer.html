{% assign t = site.data.translations[page.lang].footer %}

<footer class="footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-brand">
        <h3>{{ t.brand }}</h3>
        <p>{{ t.tagline }}</p>
      </div>
      <!-- Uncomment if you want contact info
      <div class="footer-contact">
        <h4>{{ t.contact_title }}</h4>
        <p>{{ t.contact_title }}: <a href="mailto:{{ t.email }}">{{ t.email }}</a></p>
      </div>
      -->
    </div>
    <div class="footer-bottom">
      <p>&copy; {{ t.copyright }}</p>
      <div class="footer-social">
        <a href="https://www.facebook.com/profile.php?id=61585677064925"
           target="_blank" rel="noopener noreferrer"
           class="footer-social-link" aria-label="Facebook">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
               viewBox="0 0 24 24" fill="currentColor">
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
          </svg>
        </a>
      </div>
    </div>
  </div>
</footer>
