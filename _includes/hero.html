{% assign t = site.data.translations[page.lang].hero %}

<section id="hero" class="hero-section">
  <div class="container">
    <div class="hero-content">
      <div class="hero-text">
        <h1 class="headline">{{ t.headline }}</h1>
        <p class="subheadline">{{ t.subheadline }}</p>

        <div class="info-box">
          <span class="icon">💡</span>
          <p><strong>{{ t.info_box }}</strong></p>
        </div>

      </div>

      <div class="hero-image">
        <div class="hero-video-thumb" onclick="showDemoVideo()">
          <img src="{{ '/assets/images/image0.png' | relative_url }}"
               alt="{{ t.image_alt }}"
               loading="lazy" />
          <div class="hero-play-overlay">
            <div class="hero-play-btn">
              <svg viewBox="0 0 24 24" fill="white" width="44" height="44">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
