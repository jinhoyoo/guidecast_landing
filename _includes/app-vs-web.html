{% assign t = site.data.translations[page.lang].app_vs_web %}

<section id="app-vs-web" class="app-vs-web-section">
  <div class="container">
    <h2 class="section-title">{{ t.title }}</h2>

    <div class="comparison-table-wrapper">
      <table class="comparison-table">
        <thead>
          <tr>
            <th>{{ t.headers.item }}</th>
            <th>{{ t.headers.web }}</th>
            <th class="highlight">
              {{ t.headers.guidecast }}
              <span class="comparison-badge">{{ t.badge }}</span>
            </th>
          </tr>
        </thead>
        <tbody>
          {% for row in t.rows %}
            <tr>
              <td>{{ row.item }}</td>
              <td>{{ row.web }}</td>
              <td class="highlight">{{ row.guidecast }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

    <div class="info-box" style="margin-top: 2rem;">
      <span class="icon">📱</span>
      <p>{{ t.note }}</p>
    </div>
  </div>
</section>
